name: CI/CD — Build Docker & Deploy Web Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build Docker Image & Push to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./clean
          file: ./clean/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Deploy Static WASM Game to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-github-pages:
    name: 🌐 Deploy to GitHub Pages
    needs: build-and-push-docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Web Build Assets from Docker Stage
        run: |
          cd ./clean
          docker build --target patcher -t game-builder .
          CONTAINER_ID=$(docker create game-builder)
          mkdir -p ../dist
          docker cp $CONTAINER_ID:/output/. ../dist/
          docker rm $CONTAINER_ID
          cd ..
          
          # Flatten nested folder if index.html is inside a subfolder
          if [ ! -f ./dist/index.html ]; then
            SUBDIR=$(find ./dist -name "index.html" -exec dirname {} \; | head -1)
            if [ -n "$SUBDIR" ]; then
              cp -r "$SUBDIR"/* ./dist/
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
