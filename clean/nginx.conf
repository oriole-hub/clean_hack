server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types and add custom WASM/data types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream data;
    }

    # Required headers for SharedArrayBuffer (Ren'Py WASM threading)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Gzip compression for large assets
    gzip on;
    gzip_types
        application/javascript
        application/wasm
        application/octet-stream
        text/css
        text/plain;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(wasm|data|js|css|png|jpg|jpeg|webp|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            # Re-add COOP/COEP since add_header in nested blocks replaces parent
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }
}
